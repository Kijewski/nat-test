[package]
name = "nat-test"
description = "Determine your NAT type, and external IP address by querying multiple STUN servers."
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/Kijewski/nat-test"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition", "--cfg=docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
base64-ng = "2.1.1"
clap = { version = "4.6.10", features = ["cargo", "derive"] }
directories = "6.0.0"
either = "1.19.0"
indicatif = "0.18.6"
iprfc = "1.0.0"
monostate = "1.0.3"
pretty-error-debug = "0.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rustix = { version = "1.1.6", features = ["termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_json_lenient = "0.2.4"
serde_path_to_error = "0.1.20"
stunclient = "0.4.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "net", "rt", "signal", "tracing"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["."]

[workspace.lints.rust]
unknown_lints = { level = "allow", priority = -1 }
unsafe_code = { level = "forbid", priority = -1 }

absolute_paths_not_starting_with_crate = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "warn"
noop_method_call = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
warnings = "warn"

[workspace.lints.clippy]
collapsible_match = "warn"
expect_used = "warn"
match_ref_pats = "warn"
match_same_arms = "warn"
match_single_binding = "warn"
needless_bool = "deny"
needless_late_init = "warn"
needless_match = "warn"
redundant_guards = "warn"
redundant_pattern = "warn"
redundant_pattern_matching = "warn"
single_match = "warn"
single_match_else = "warn"
unwrap_used = "warn"
